<!DOCTYPE html>
<html lang="en" dir="ltr" data-theme="light">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="icon" href="assets/fav.png" type="image/png">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">
    
    <!-- Premium Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700&family=Playfair+Display:ital,wght@0,400..900;1,400..900&display=swap" rel="stylesheet">

    <title>Page Not Found · Spinny</title>

    <script src="tailwind.js"></script>
    <script>
        tailwind.config = {
            darkMode: 'class',
            theme: {
                extend: {
                    colors: {
                        accent: 'var(--color-accent)',
                        'accent-light': 'var(--color-accent-light)',
                    }
                }
            }
        };
    </script>
    <style>
        /* --- Premium Dessert & Pastel Pink Palette --- */
        :root, html[data-theme='light'] {
            --color-background: #FFFDF9; /* Creamy warm off-white */
            --color-primary-text: #3D271D; /* Rich dark chocolate cocoa */
            --color-secondary-text: #7C6053; /* Warm taupe / milk chocolate */
            --color-accent: #FF0000; /* Red (Primary) */
            --color-accent-light: #CC0000; /* Dark Red (Secondary) */
            --color-border: #F3ECE3; /* Soft crust beige */
            --color-hover: #FFF5E6; /* Warm vanilla cream hover */
            --color-footer-bg: #2A1A12; /* Deep cocoa brown footer */
            --color-footer-text: #F5EBE6; 
        }
        html[data-theme='dark'] {
            --color-background: #0E0F12; /* Premium dark charcoal grey */
            --color-primary-text: #F3F4F6; /* Soft light grey / white */
            --color-secondary-text: #9CA3AF; /* Muted light grey */
            --color-accent: #FF0000; /* Red (Primary Brand Color) */
            --color-accent-light: #B30000; /* Dark Red (Secondary Brand Color) */
            --color-border: #23272E; /* Clean dark grey border */
            --color-hover: #1A1C20; /* Alternate dark grey for sections */
            --color-footer-bg: #07080A; /* Pitch dark footer */
            --color-footer-text: #E5E7EB; 
        }
        
        body {
            background-color: var(--color-background);
            color: var(--color-primary-text);
            font-family: 'Outfit', sans-serif;
            transition: background-color 0.3s, color 0.3s;
            overflow-x: hidden;
        }
        
        .text-primary-text { color: var(--color-primary-text); }
        .text-secondary-text { color: var(--color-secondary-text); }
        .text-accent { color: var(--color-accent); }
        .text-accent-light { color: var(--color-accent-light); }
        .bg-background { background-color: var(--color-background); }
        .bg-hover { background-color: var(--color-hover); }
        .border-border { border-color: var(--color-border); }

        /* ── Typography Size & Weight System ── */
        h1, h2, h3, h4, h5, h6 {
            font-family: 'Playfair Display', serif;
            font-weight: 550 !important;
        }
        h1 {
            font-size: 3.75rem !important; /* 60px */
        }
        @media (min-width: 640px) {
            h1 {
                font-size: 5.5rem !important; /* 88px for 404 */
            }
        }
        h2 {
            font-size: 1.875rem !important; /* 30px */
        }
        @media (min-width: 640px) {
            h2 {
                font-size: 2.25rem !important; /* 36px */
            }
        }
        p, .text-secondary-text {
            font-weight: 400 !important;
        }

        /* Rich Gradient */
        .bg-custom-gradient {
            background: linear-gradient(135deg, var(--color-accent) 0%, var(--color-accent-light) 100%);
        }

        /* ── Canonical Button System ── */
        .btn-primary {
            background: linear-gradient(135deg, var(--color-accent) 0%, var(--color-accent-light) 100%);
            color: white;
            transition: all 0.3s ease;
            cursor: pointer;
        }
        .btn-primary:hover {
            opacity: 0.92;
            transform: translateY(-2px);
            box-shadow: 0 6px 20px rgba(255, 0, 0, 0.35);
        }
        .btn-outline {
            background: transparent;
            color: var(--color-accent);
            border: 2px solid var(--color-accent);
            transition: all 0.3s ease;
            cursor: pointer;
        }
        .btn-outline:hover {
            background: var(--color-accent);
            color: white;
            box-shadow: 0 4px 12px rgba(255, 0, 0, 0.25);
        }

        /* 404 floating animation */
        @keyframes float {
            0% { transform: translateY(0px); }
            50% { transform: translateY(-12px); }
            100% { transform: translateY(0px); }
        }
        .float-animation {
            animation: float 4s ease-in-out infinite;
        }

        /* Decorative blob */
        .blob {
            border-radius: 50%;
            filter: blur(80px);
            opacity: 0.08;
            position: absolute;
            pointer-events: none;
        }
    </style>
</head>
<body class="antialiased min-h-screen flex items-center justify-center p-6 relative">

    <!-- Theme toggle (top corner, minimal) -->
    <div class="fixed top-6 right-6 z-50">
        <button id="theme-toggle" class="text-primary-text hover:text-accent p-3 rounded-full transition duration-200 bg-hover/70 border border-border/60 backdrop-blur-sm shadow-sm">
            <svg class="w-6 h-6 light-icon" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 3v1m0 16v1m9-9h-1M4 12H3m15.364 6.364l-.707-.707M6.343 6.343l-.707-.707m12.728 0l-.707.707M6.343 17.657l-.707.707M16 12a4 4 0 11-8 0 4 4 0 018 0z"></path>
            </svg>
            <svg class="w-6 h-6 dark-icon hidden" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M20.354 15.354A9 9 0 018.646 3.646 9.003 9.003 0 0012 21a9.003 9.003 0 008.354-5.646z"></path>
            </svg>
        </button>
    </div>

    <!-- Background decorative shapes -->
    <div class="blob w-[500px] h-[500px] -top-40 -right-40" style="background: var(--color-accent);"></div>
    <div class="blob w-[600px] h-[600px] -bottom-60 -left-40" style="background: var(--color-accent-light);"></div>
    <div class="blob w-[300px] h-[300px] top-1/2 left-1/2 -translate-x-1/2 -translate-y-1/2" style="background: var(--color-accent); opacity: 0.03;"></div>

    <!-- Main 404 Content -->
    <main class="relative z-10 w-full max-w-3xl mx-auto">
        <div class="bg-background/80 backdrop-blur-sm rounded-3xl border border-border/60 shadow-2xl p-8 sm:p-12 lg:p-16 text-center transition-all duration-300">
            
            <!-- 404 graphic with car icon -->
            <div class="float-animation inline-block mb-4">
                <span class="text-[7rem] sm:text-[9rem] leading-none font-serif font-black tracking-tighter text-accent select-none drop-shadow-sm">
                    4<span class="inline-block mx-1 sm:mx-2"><i class="fa-solid fa-car-side text-[4rem] sm:text-[5.5rem] align-middle text-accent-light"></i></span>4
                </span>
            </div>

            <!-- Heading -->
            <h1 class="text-primary-text !text-3xl sm:!text-4xl md:!text-5xl mt-2 mb-4">
                Oops! Page not found
            </h1>

            <!-- Description -->
            <p class="text-secondary-text text-base sm:text-lg leading-relaxed max-w-xl mx-auto mb-8">
                The page you're looking for doesn't exist or has been moved. 
                But don't worry — your perfect car is still waiting for you.
            </p>

            <!-- CTA Buttons -->
            <div class="flex flex-col sm:flex-row gap-4 justify-center items-center">
                <a href="index.html" class="btn-primary px-8 py-3.5 rounded-full font-bold text-sm inline-flex items-center justify-center gap-2 shadow-lg shadow-accent/25 w-full sm:w-auto">
                    <i class="fa-solid fa-house"></i> Back to Home
                </a>
                <a href="buy.html" class="btn-outline px-8 py-3.5 rounded-full font-bold text-sm inline-flex items-center justify-center gap-2 w-full sm:w-auto">
                    <i class="fa-solid fa-car"></i> Browse Cars
                </a>
            </div>

            <!-- Quick links separator -->
            <div class="relative mt-10 pt-6 border-t border-border/60">
                <p class="text-xs uppercase tracking-widest text-secondary-text mb-3 font-semibold">Quick links</p>
                <div class="flex flex-wrap items-center justify-center gap-x-6 gap-y-2 text-sm">
                    <a href="index.html" class="text-secondary-text hover:text-accent transition-colors duration-200 flex items-center gap-1.5">
                        <i class="fa-solid fa-chevron-right text-[0.6rem] text-accent"></i> Home
                    </a>
                    <a href="buy.html" class="text-secondary-text hover:text-accent transition-colors duration-200 flex items-center gap-1.5">
                        <i class="fa-solid fa-chevron-right text-[0.6rem] text-accent"></i> Buy
                    </a>
                    <a href="sell.html" class="text-secondary-text hover:text-accent transition-colors duration-200 flex items-center gap-1.5">
                        <i class="fa-solid fa-chevron-right text-[0.6rem] text-accent"></i> Sell
                    </a>
                    <a href="about.html" class="text-secondary-text hover:text-accent transition-colors duration-200 flex items-center gap-1.5">
                        <i class="fa-solid fa-chevron-right text-[0.6rem] text-accent"></i> About
                    </a>
                    <a href="contact.html" class="text-secondary-text hover:text-accent transition-colors duration-200 flex items-center gap-1.5">
                        <i class="fa-solid fa-chevron-right text-[0.6rem] text-accent"></i> Contact
                    </a>
                </div>
            </div>
        </div>

        <!-- Tiny brand watermark (optional, minimal) -->
        <div class="text-center mt-6">
            <span class="text-xs text-secondary-text/60 flex items-center justify-center gap-1.5">
                <i class="fa-solid fa-car text-accent/40 text-sm"></i> Spinny · Certified Used Cars
            </span>
        </div>
    </main>

    <!-- SCRIPT (theme toggle only, no drawer/nav logic) -->
    <script>
        document.addEventListener('DOMContentLoaded', () => {
            const html = document.documentElement;

            // Theme Switcher
            const themeToggle = document.getElementById('theme-toggle');
            
            const applyTheme = (theme) => {
                html.setAttribute('data-theme', theme);
                html.classList.toggle('dark', theme === 'dark');
                document.querySelectorAll('.light-icon').forEach(i => i.classList.toggle('hidden', theme === 'dark'));
                document.querySelectorAll('.dark-icon').forEach(i => i.classList.toggle('hidden', theme === 'light'));
            };
            
            themeToggle?.addEventListener('click', () => {
                const next = html.getAttribute('data-theme') === 'light' ? 'dark' : 'light';
                localStorage.setItem('theme', next);
                applyTheme(next);
            });

            // Apply saved theme
            applyTheme(localStorage.getItem('theme') || 'light');
        });
    </script>
</body>
</html>
